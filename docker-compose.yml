# =============================================================================
# Docker Compose - Assistant IA PHOSBOUCRAA
# Orchestrates all services: PostgreSQL, Redis, MinIO, FastAPI backend,
# Celery worker/beat, and the React frontend (served via Nginx).
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL (with pgvector extension) — primary relational store.
  # In production this role is played by Supabase (managed Postgres + pgvector).
  # ---------------------------------------------------------------------------
  db:
    image: pgvector/pgvector:pg16
    container_name: phosboucraa_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-phosboucraa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-phosboucraa}
      POSTGRES_DB: ${POSTGRES_DB:-phosboucraa}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./backend/scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-phosboucraa}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Redis — Celery broker/result backend + application cache.
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: phosboucraa_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # MinIO — S3-compatible object storage for CVs and cover letters.
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: phosboucraa_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Creates the application bucket on startup, then exits.
  minio-init:
    image: minio/mc:latest
    container_name: phosboucraa_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb --ignore-existing local/${MINIO_BUCKET:-documents};
      mc anonymous set download local/${MINIO_BUCKET:-documents};
      exit 0;
      "

  # ---------------------------------------------------------------------------
  # FastAPI backend — REST API, auth, business logic.
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: pfa-backend:latest
    container_name: phosboucraa_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Uses DATABASE_URL from .env if set (e.g. Supabase); otherwise the local db service.
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-phosboucraa}:${POSTGRES_PASSWORD:-phosboucraa}@db:5432/${POSTGRES_DB:-phosboucraa}}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  # ---------------------------------------------------------------------------
  # Celery worker — async CV analysis, matching, notifications.
  # ---------------------------------------------------------------------------
  celery-worker:
    # Reuse the backend image (identical build context) to avoid a 3x rebuild + race.
    image: pfa-backend:latest
    container_name: phosboucraa_celery_worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Uses DATABASE_URL from .env if set (e.g. Supabase); otherwise the local db service.
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-phosboucraa}:${POSTGRES_PASSWORD:-phosboucraa}@db:5432/${POSTGRES_DB:-phosboucraa}}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
    depends_on:
      - backend
      - redis
    volumes:
      - ./backend:/app
    command: celery -A app.core.celery_app.celery_app worker --loglevel=info --concurrency=2

  # ---------------------------------------------------------------------------
  # Celery beat — periodic scheduled tasks (e.g. nightly auto-matching).
  # ---------------------------------------------------------------------------
  celery-beat:
    # Reuse the backend image (identical build context) to avoid a 3x rebuild + race.
    image: pfa-backend:latest
    container_name: phosboucraa_celery_beat
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Uses DATABASE_URL from .env if set (e.g. Supabase); otherwise the local db service.
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-phosboucraa}:${POSTGRES_PASSWORD:-phosboucraa}@db:5432/${POSTGRES_DB:-phosboucraa}}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - backend
      - redis
    volumes:
      - ./backend:/app
    command: celery -A app.core.celery_app.celery_app beat --loglevel=info

  # ---------------------------------------------------------------------------
  # React frontend — built with Vite, served by Nginx.
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
    container_name: phosboucraa_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  db_data:
  redis_data:
  minio_data:
