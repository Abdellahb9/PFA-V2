# =============================================================================
# Netlify — FULL serverless app: static React frontend + Netlify Functions.
# Data on Supabase (Postgres + Storage + Auth). LLM extraction on Groq.
#
# Monorepo: no `base` directory (avoids ambiguous publish/functions paths).
# All paths below are relative to the REPOSITORY ROOT.
# =============================================================================

[build]
  # Install BOTH the frontend and the functions deps, then build the frontend.
  command = "npm --prefix frontend install && npm --prefix netlify/functions install && cd frontend && npm run build"
  publish = "frontend/dist"
  functions = "netlify/functions"

[build.environment]
  # Node 22 has native global WebSocket — required by @supabase/supabase-js
  # (the realtime client crashes on Node 20: "without native WebSocket support").
  NODE_VERSION = "22"
  # The SPA calls the API at /api/* (functions declare their own `config.path`).
  VITE_API_URL = "/api"
  # VITE_SUPABASE_* + SUPABASE_URL are PUBLIC by design (baked into the client
  # bundle) -> don't let Netlify's secrets scanner fail the build.
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_URL,SUPABASE_URL,VITE_SUPABASE_ANON_KEY"

[functions]
  node_bundler = "esbuild"
  # The background analysis function is auto-detected by its `-background` suffix.

# --- Local dev (`netlify dev`): run the Vite app in frontend/ + functions -----
[dev]
  command = "npm --prefix frontend run dev"
  targetPort = 5173
  framework = "#custom"
  publish = "frontend/dist"

# --- SPA fallback (function routes /api/* are matched before this) ----------
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
