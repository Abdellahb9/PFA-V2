# =============================================================================
# Netlify — FULL serverless app: static React frontend + Netlify Functions (the
# backend). Data on Supabase (Postgres + Storage + Auth). LLM extraction on Groq.
# No Docker / Celery / Redis / MinIO / FastAPI.
# =============================================================================

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"
  # Functions live in a sibling folder (relative to repo root, not base).
  functions = "../netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  # The SPA calls the API at /api/* which is rewritten to the functions below.
  VITE_API_URL = "/api"

[functions]
  node_bundler = "esbuild"
  # Each function declares its own route via `export const config = { path }`.
  # The background analysis function is auto-detected by its `-background` suffix.

# --- SPA fallback (function routes are matched before this) -----------------
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
