# =============================================================================
# Nginx reverse proxy (optional, for a single-entrypoint production setup).
# Routes /api -> backend, everything else -> frontend.
# In docker-compose the frontend already embeds its own Nginx; this file is
# provided for a unified gateway deployment.
# =============================================================================
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    gzip          on;
    gzip_types    text/plain text/css application/json application/javascript text/xml application/xml;

    upstream backend {
        server backend:8000;
    }

    upstream frontend {
        server frontend:80;
    }

    server {
        listen 80;
        server_name _;
        client_max_body_size 25M;   # allow CV / PDF uploads

        # API + auto-generated docs.
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /docs   { proxy_pass http://backend; }
        location /redoc  { proxy_pass http://backend; }
        location /openapi.json { proxy_pass http://backend; }

        # Frontend SPA.
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
