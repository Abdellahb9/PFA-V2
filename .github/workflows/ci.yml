name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  frontend:
    name: Frontend (tests · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - name: Tests (vitest + Testing Library)
        run: npm --prefix frontend test
      - name: Build (runs tsc -b then vite build)
        run: npm --prefix frontend run build

  api:
    name: API (tsc · vitest · bundle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests (vitest, SQL on PGlite)
        run: npm test
      - name: Bundle (what Vercel deploys)
        run: npm run bundle-api
